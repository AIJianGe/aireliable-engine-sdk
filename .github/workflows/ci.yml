name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (public contract modules)
        run: |
          ruff check \
            src/aireliable_engine/manifest.py \
            src/aireliable_engine/package.py \
            src/aireliable_engine/cli.py
      - name: Contract tests
        # 只跑公开契约面（CLI / manifest）；历史 workflow 引擎用例由维护者本地执行
        run: pytest tests/test_cli.py tests/test_manifest.py -q
      - name: CLI smoke
        run: |
          aireliable-engine --version
          aireliable-engine --help > /dev/null
